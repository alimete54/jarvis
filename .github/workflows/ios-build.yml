# JARVIS iOS build — GitHub Actions (ücretsiz)
# Apple Developer Program üyeliği GEREKMEZ.
# 1) Bu workflow'u çalıştır (Actions sekmesi) → imzasız .ipa artefaktı iner.
# 2) Windows'ta Sideloadly (https://sideloadly.io) ile ücretsiz Apple ID kullanarak iPhone'a kur.
# Detaylar: README.md

name: iOS Unsigned IPA Build

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # SPM binary framework'leri Sideloadly ile yeniden imzalanamıyor ve
      # uygulama açılışta çöküyor. CocoaPods ile derliyoruz:
      - run: flutter config --no-enable-swift-package-manager

      - run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r jarvis.ipa Payload/
          mv jarvis.ipa ../jarvis.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-unsigned-ipa
          path: build/ios/jarvis.ipa
