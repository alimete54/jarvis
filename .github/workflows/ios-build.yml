name: JARVIS iOS Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: iOS platform dosyalari
        run: flutter create --platforms=ios --project-name jarvis .

      - name: Bagimliliklari yukle
        run: flutter pub get

      - name: Simulator build
        run: flutter build ios --release --no-codesign --simulator

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-simulator
          path: build/ios/iphonesimulator/Runner.app
