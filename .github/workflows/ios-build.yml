name: JARVIS iOS Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: iOS platform dosyalari
        run: flutter create --platforms=ios --project-name jarvis .

      - name: Bagimliliklari yukle
        run: flutter pub get

      - name: DEVELOPMENT_TEAM ekle (Ruby)
        run: |
          ruby -e '
            path = "ios/Runner.xcodeproj/project.pbxproj"
            content = File.read(path)
            content = content.gsub(/DEVELOPMENT_TEAM\s*=\s*"";/, "DEVELOPMENT_TEAM = 0000000000;")
            content = content.gsub(/DevelopmentTeam\s*=\s*"";/, "DevelopmentTeam = 0000000000;")
            unless content.include?("DEVELOPMENT_TEAM = 0000000000")
              content = content.sub(/PRODUCT_BUNDLE_IDENTIFIER[^;]+;/) { |m| "#{m}\n\t\t\t\tDEVELOPMENT_TEAM = 0000000000;" }
            end
            File.write(path, content)
            puts "Patched DEVELOPMENT_TEAM"
          '
          grep -n "DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj

      - name: IPA build
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa && zip -r ../../../JARVIS.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ipa
          path: JARVIS.ipa
