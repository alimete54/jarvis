name: JARVIS iOS Build

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: iOS platform dosyalari
        run: flutter create --platforms=ios --project-name jarvis .

      - name: Bagimliliklari yukle
        run: flutter pub get

      - name: Fastlane kurulumu
        run: gem install fastlane

      - name: Xcode proje ayarlari (imzali)
        run: |
          ruby -e '
            path = "ios/Runner.xcodeproj/project.pbxproj"
            content = File.read(path)
            # Development Team
            content = content.gsub(/DEVELOPMENT_TEAM\s*=\s*"";/, "DEVELOPMENT_TEAM = 0000000000;")
            content = content.gsub(/DevelopmentTeam\s*=\s*"";/, "DevelopmentTeam = 0000000000;")
            # Code Sign Style = Automatic
            content = content.gsub(/CODE_SIGN_STYLE\s*=\s*Manual;/, "CODE_SIGN_STYLE = Automatic;")
            content = content.gsub(/CODE_SIGN_STYLE\s*=\s*"";/, "CODE_SIGN_STYLE = Automatic;")
            unless content.include?("CODE_SIGN_STYLE = Automatic")
              content = content.sub(/PRODUCT_BUNDLE_IDENTIFIER[^;]+;/) { |m| "#{m}\n\t\t\t\tCODE_SIGN_STYLE = Automatic;" }
            end
            unless content.include?("DEVELOPMENT_TEAM = 0000000000")
              content = content.sub(/PRODUCT_BUNDLE_IDENTIFIER[^;]+;/) { |m| "#{m}\n\t\t\t\tDEVELOPMENT_TEAM = 0000000000;" }
            end
            File.write(path, content)
          '
          grep -n "DEVELOPMENT_TEAM\|CODE_SIGN_STYLE" ios/Runner.xcodeproj/project.pbxproj

      - name: Imzali IPA build (Fastlane)
        env:
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          FASTLANE_DONT_STORE_PASSWORD: "1"
        run: |
          cd ios
          fastlane gym \
            --scheme Runner \
            --workspace Runner.xcworkspace \
            --configuration Release \
            --export_method development \
            --output_name JARVIS \
            --output_directory ../build/ios/ipa \
            --include_bitcode false

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-ipa
          path: build/ios/ipa/*.ipa
